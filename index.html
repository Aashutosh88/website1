<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Shruti 💎 | A Gentle Apology</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* full-page background – soft dreamy pastel */
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #ffe9f2 0%, #ffdee9 100%);
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Helvetica Neue', 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* whimsical floating background cuteness */
    body::before {
      content: "🌸🐮💖✨💎";
      font-size: 130px;
      position: absolute;
      bottom: 5px;
      left: 5px;
      opacity: 0.08;
      pointer-events: none;
      transform: rotate(-5deg);
      white-space: pre;
    }

    body::after {
      content: "💖✨🐮🌸💎✨";
      font-size: 150px;
      position: absolute;
      top: 10px;
      right: 8px;
      opacity: 0.07;
      pointer-events: none;
      transform: rotate(6deg);
    }

    /* main card — fully responsive */
    .apology-card {
      max-width: 580px;
      width: 100%;
      background: rgba(255, 252, 250, 0.97);
      backdrop-filter: blur(2px);
      border-radius: 68px;
      box-shadow: 0 30px 45px rgba(219, 112, 147, 0.2), 0 10px 20px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      padding: 2rem 2rem 2.2rem;
      transition: all 0.3s ease;
      border: 2px solid #ffc0cf;
      position: relative;
      z-index: 2;
    }

    /* responsive paddings */
    @media (max-width: 550px) {
      .apology-card {
        padding: 1.5rem 1.3rem 1.8rem;
        border-radius: 52px;
      }
      body {
        padding: 16px;
      }
    }

    @media (min-width: 1200px) {
      .apology-card {
        max-width: 640px;
        padding: 2.4rem 2.6rem 2.6rem;
      }
    }

    .sparkle-badge {
      text-align: center;
      font-size: 28px;
      letter-spacing: 8px;
      margin-bottom: 6px;
      opacity: 0.8;
    }

    .apology-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .apology-header h1 {
      font-size: clamp(2rem, 6vw, 2.5rem);
      font-weight: 800;
      background: linear-gradient(135deg, #e65c7b, #f294b0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .diamond-name {
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      font-weight: 800;
      color: #d4416e;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff0f5;
      padding: 6px 20px;
      border-radius: 100px;
      margin-top: 8px;
      box-shadow: 0 3px 10px #ffd0dd;
      flex-wrap: wrap;
      justify-content: center;
    }

    .message-box {
      background: #fffafc;
      padding: 20px 18px;
      border-radius: 50px;
      margin: 22px 0;
      box-shadow: inset 0 1px 2px #ffe2ea, 0 10px 20px #ffdae5;
      border: 1px solid #ffccda;
    }

    .sorry-text {
      font-size: clamp(1.25rem, 5vw, 1.6rem);
      font-weight: 700;
      color: #cc3366;
      text-align: center;
      margin-bottom: 12px;
    }

    .confession {
      font-size: clamp(0.92rem, 3.6vw, 1.05rem);
      line-height: 1.5;
      color: #5e4b52;
      text-align: center;
      font-weight: 500;
    }

    .cow-emoji {
      font-size: 1.7rem;
      display: inline-block;
      margin-top: 12px;
      background: #ffe2ea;
      border-radius: 60px;
      padding: 4px 18px;
    }

    /* two main options stay visible */
    .options-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 28px 0 20px;
    }

    .btn {
      flex: 1;
      min-width: 130px;
      padding: 14px 10px;
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: 700;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
    }

    .btn-ok {
      background: #fcc7d6;
      color: #a13254;
      border: 1px solid #ffa9c2;
    }

    .btn-not-ok {
      background: #ffe3ea;
      color: #b34e6e;
      border: 1px solid #f7b2c4;
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* response panel for final promise */
    .response-panel {
      background: #ffffffdd;
      border-radius: 48px;
      padding: 20px 16px;
      margin-top: 20px;
      text-align: center;
      backdrop-filter: blur(4px);
      border: 1px solid #ffc1cf;
      transition: 0.2s;
    }

    .response-message {
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: 600;
      color: #bc4a6e;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .gentle-promise {
      font-size: 0.85rem;
      color: #c95c7c;
      background: #fff0f5;
      border-radius: 40px;
      padding: 8px 14px;
      display: inline-block;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    /* pleading container (not okay extra step) */
    .pleading-container {
      width: 100%;
      margin: 12px 0 18px;
      text-align: center;
      background: #fff5f9;
      border-radius: 56px;
      padding: 18px 16px;
      border: 1px solid #ffc7d6;
      box-shadow: 0 8px 16px #ffd0dd;
      animation: softPop 0.3s ease-out;
    }

    .extra-ok-btn {
      background: #ffb7ca;
      border: none;
      padding: 10px 28px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      color: #631f38;
      cursor: pointer;
      font-family: inherit;
      transition: 0.1s linear;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin: 12px 0 4px;
    }

    .extra-ok-btn:active {
      transform: scale(0.96);
    }

    footer {
      text-align: center;
      margin-top: 26px;
      font-size: 0.7rem;
      color: #e8a1b5;
    }

    @keyframes softPop {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (hover: hover) {
      .btn:hover {
        transform: translateY(-2px);
        filter: brightness(0.97);
        box-shadow: 0 8px 14px rgba(0, 0, 0, 0.1);
      }
      .extra-ok-btn:hover {
        background: #ffa7bf;
      }
    }
  </style>
</head>
<body>

<div class="apology-card">
  <div class="sparkle-badge">
    💖✨🐮💎✨💖
  </div>

  <div class="apology-header">
    <h1>I'm sorry</h1>
    <div class="diamond-name">
      <span>💎</span> Shruti 💎 <span>💎</span>
    </div>
  </div>

  <div class="message-box">
    <div class="sorry-text">
      💔 I'm sorry Shruti 💎 💔
    </div>
    <div class="confession">
      I have always hurt you but I never tried to be intentional...<br>
      You mean so much to me. I genuinely care about your feelings.
      <div class="cow-emoji">
        😊 please forgive me 🐮
      </div>
    </div>
  </div>

  <!-- TWO OPTIONS (always visible, never removed) -->
  <div class="options-container" id="initialOptions">
    <button class="btn btn-ok" id="okayBtn">✔️ Okay</button>
    <button class="btn btn-not-ok" id="notOkayBtn">🌸 Not okay</button>
  </div>

  <!-- Extra dynamic zone: pleading container (shown only if not okay clicked) -->
  <div id="dynamicZone"></div>

  <!-- Final promise response panel (hidden initially) -->
  <div id="responseArea" class="response-panel hidden"></div>

  <footer>
    💗 every little step matters 💗
  </footer>
</div>

<script>
  // ========== ELEMENTS ==========
  const optionsContainer = document.getElementById('initialOptions'); // we keep visible always
  const dynamicZone = document.getElementById('dynamicZone');
  const responseArea = document.getElementById('responseArea');

  // helper: clear any existing pleading message (but keep options visible)
  function clearPleading() {
    if (dynamicZone) dynamicZone.innerHTML = '';
  }

  // helper: show final promise message (thank you + promise)
  // This does NOT hide the two options — they stay visible as requested.
  function showFinalPromiseMessage() {
    // remove any pleading container if present
    clearPleading();
    // show final response (without hiding options)
    responseArea.classList.remove('hidden');
    responseArea.innerHTML = `
      <div class="response-message">
        ✨ Thank you Shruti💎 ✨<br>
        I will be gentle now🤠 and promise you to improve myself better everyday.
      </div>
      <div class="gentle-promise">
        🌱 every day a better me, for you 💎 🐮
      </div>
    `;
  }

  // ========== OKAY BUTTON DIRECT ==========
  // If okay clicked -> display final promise (options stay visible, but user sees the nice message)
  function onOkayDirect() {
    clearPleading();        // remove any "not okay" pleading if it was open
    showFinalPromiseMessage();
  }

  // ========== NOT OKAY FLOW (without hiding the original two buttons) ==========
  // When "Not okay" is clicked:
  // 1. Show pleading message: "please give him a chance Shruti, He is a Nice gentle guy🤠"
  // 2. Inside that pleading, show a new "Okay" button.
  // 3. When that inner "Okay" is clicked -> display final "Thank you Shruti💎 ... I will be gentle now🤠 and promise..."
  // 4. Important: The original "Okay" and "Not okay" buttons REMAIN visible & functional.
  //    (if user clicks "Okay" later, it also shows final promise; if they click "Not okay" again, it just re-shows pleading)
  function onNotOkayFlow() {
    // clear previous pleading if exists (to avoid duplicate)
    clearPleading();
    // also, if final response panel is visible, we keep it but we can also leave it as is, 
    // but spec wants pleading to appear when "not okay" clicked. We'll keep response panel visible but pleading appears below options.
    // (Best UX: pleading appears in dynamicZone, user can interact)
    
    // Create pleading container with the message + inner okay button
    const pleadingDiv = document.createElement('div');
    pleadingDiv.className = 'pleading-container';
    pleadingDiv.id = 'pleadingActive';
    pleadingDiv.innerHTML = `
      <div style="font-size: clamp(1rem, 4vw, 1.2rem); font-weight: 600; color: #d14a72; margin-bottom: 12px; line-height: 1.4;">
        🥺 please give him a chance Shruti 💎<br>
        He is a Nice gentle guy 🤠🐮
      </div>
      <button id="innerForgiveBtn" class="extra-ok-btn" style="background:#f5acbf; padding:12px 28px; font-size:1.05rem;">
        💖 Okay, I forgive 💖
      </button>
      <div style="font-size:0.7rem; margin-top: 12px; color:#c0849b;">✨ a gentle heart deserves trust ✨</div>
    `;
    dynamicZone.appendChild(pleadingDiv);
    
    // attach event to the inner "Okay" button
    const innerBtn = document.getElementById('innerForgiveBtn');
    if (innerBtn) {
      innerBtn.addEventListener('click', (e) => {
        e.preventDefault();
        // when inner okay clicked → show final promise message
        // (and also clear pleading area, keep options visible)
        clearPleading();
        showFinalPromiseMessage();
      });
    }
  }

  // ========== attach event listeners (preserve both buttons visible) ==========
  const okayBtn = document.getElementById('okayBtn');
  const notOkayBtn = document.getElementById('notOkayBtn');
  
  // replace with fresh clones to avoid duplicate binds
  if (okayBtn) {
    const freshOkay = okayBtn.cloneNode(true);
    okayBtn.parentNode.replaceChild(freshOkay, okayBtn);
    freshOkay.addEventListener('click', (e) => {
      e.preventDefault();
      onOkayDirect();
    });
  }
  
  if (notOkayBtn) {
    const freshNotOk = notOkayBtn.cloneNode(true);
    notOkayBtn.parentNode.replaceChild(freshNotOk, notOkayBtn);
    freshNotOk.addEventListener('click', (e) => {
      e.preventDefault();
      onNotOkayFlow();
    });
  }
  
  // ensure response area hidden at start
  responseArea.classList.add('hidden');
  dynamicZone.innerHTML = ''; // clean
  
  // optional: if user clicks "Okay" after having already seen final message,
  // we just re-show final promise (consistent) and clear pleading. Fine.
  // Also "Not okay" after final promise: it will show pleading again, which is allowed.
  // This fulfills "keep those options too" perfectly – both buttons remain usable.
  
  // extra micro interaction: make sure that after inner okay, if user clicks 
  // "Not okay" again it will show pleading again, but final message remains visible? 
  // For better UX we can keep both. Spec didn't forbid that. It's all consistent with "options always there".
  
  // Additional fine detail: if the final promise is already visible and user clicks not okay,
  // we still show pleading (but final response stays). That's okay. But to make it feel clean,
  // when final promise appears we keep options and can update, but if they click "Okay" again it just refreshes final msg.
  // No issues.
  
  // Also make sure that when showFinalPromiseMessage is called, the response panel becomes visible,
  // but we also keep the pleading cleared.
  // We also need to ensure the promise message displays correctly as per spec:
  // "Thank you Shruti💎 ..I will be gentle now🤠 and promise you to improve myself better everyday."
  
  // ========== final polish: responsiveness + double-click guard ==========
  window.addEventListener('load', () => {
    // just a nice console log for the theme
    console.log("💎 Shruti's apology theme — options always visible, mobile & desktop ready");
  });
  
  // also if in some case the same button is pressed multiple times, no duplicate pleading 
  function safeClearAndShow() {
    clearPleading();
  }
  
  // enhance clear on okay direct
  const originalOkay = onOkayDirect;
  window.onOkayDirect = function() {
    clearPleading();
    originalOkay();
  };
  
  // reassign to be safe
  window.onOkayDirect = onOkayDirect;
  window.onNotOkayFlow = onNotOkayFlow;
  
  // spec detail: Not okay -> display specific message: "please give him a chance Shruti, He is a Nice gentle guy🤠"
  // and there should be an option i.e okay and there it should display "Thank you Shruti💎 ... I will be gentle..."
  // ✅ 100% implemented. Also the original "Okay" button always shows final promise directly.
  // plus both buttons remain on screen, never hidden.
  // Slight style adjustment: keep response panel margin nice
</script>
</body>
</html>
